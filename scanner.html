<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code 自動接收器</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; }
        #reader { width: 100%; max-width: 400px; min-height: 300px; margin: 0 auto; background: #fff; border-radius: 10px; overflow: hidden; }
        .progress-box { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .debug-box { margin-top: 10px; font-size: 14px; color: #666; background: #eee; padding: 5px; border-radius: 5px; }
        .chunk-grid { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
        .chunk-box { width: 30px; height: 30px; line-height: 30px; background: #ccc; border-radius: 5px; color: white; font-size: 12px; }
        .chunk-box.active { background: #4CAF50; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📱 自動接收器</h2>
    <p>請啟動相機，對準螢幕上的 QR Code。</p>

    <div id="reader"></div>

    <div class="progress-box">
        進度: <span id="progress-text">0 / 0</span>
    </div>
    
    <div class="debug-box" id="debug-text">等待掃描中...</div>
    
    <div class="chunk-grid" id="chunk-grid"></div>
    <button id="download-btn" style="display: none;" onclick="downloadFile()">下載還原檔案</button>

    <script>
        let totalChunks = 0;
        let collectedChunks = {};
        let originalData = null;
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById("debug-text").innerText = "最後掃描內容: " + decodedText.substring(0, 20) + "...";
            
            const match = decodedText.match(/^(\d+)\/(\d+)\|(.*)$/);
            
            if (match) {
                const index = parseInt(match[1]) - 1;
                const total = parseInt(match[2]);
                const base64Data = match[3];

                if (totalChunks === 0) {
                    totalChunks = total;
                    initGrid(total);
                }

                if (!collectedChunks[index]) {
                    collectedChunks[index] = base64Data;
                    document.getElementById(`chunk-${index}`).classList.add("active");
                    
                    const currentCount = Object.keys(collectedChunks).length;
                    document.getElementById("progress-text").innerText = `${currentCount} / ${totalChunks}`;
                    document.getElementById("debug-text").innerText = `成功收集第 ${index + 1} 塊！`;

                    if (currentCount === totalChunks) {
                        html5QrcodeScanner.clear().then(() => {
                            document.getElementById("reader").innerHTML = "<h3 style='color:green;'>✅ 收集完畢！解壓縮中...</h3>";
                            processData();
                        });
                    }
                }
            } else {
                document.getElementById("debug-text").innerText += " (⚠️ 格式錯誤，可能掃到舊版的 QR Code)";
            }
        }

        function onScanFailure(error) {
        }

        function initGrid(total) {
            const grid = document.getElementById("chunk-grid");
            grid.innerHTML = "";
            for (let i = 0; i < total; i++) {
                let box = document.createElement("div");
                box.className = "chunk-box";
                box.id = `chunk-${i}`;
                box.innerText = i + 1;
                grid.appendChild(box);
            }
        }

        function processData() {
            try {
                let fullBase64 = "";
                for (let i = 0; i < totalChunks; i++) {
                    fullBase64 += collectedChunks[i];
                }

                let binaryString = atob(fullBase64);
                let len = binaryString.length;
                let bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                originalData = pako.inflate(bytes);

                document.getElementById("download-btn").style.display = "inline-block";
                document.getElementById("progress-text").innerText = "🎉 還原成功！";
                document.getElementById("debug-text").style.display = "none";
                
                // 自動觸發下載提示
                downloadFile();

            } catch (err) {
                alert("解壓縮失敗：" + err.message);
            }
        }

        function downloadFile() {
            if (!originalData) return;
            
            // 加入提示框，讓使用者自己輸入正確的副檔名
            let defaultName = "restored_file.py";
            let fileName = prompt("✅ 檔案還原成功！\n\n請輸入要儲存的檔案名稱與副檔名\n(例如: script.py, data.txt, app.apk)：", defaultName);
            
            if (!fileName) return; // 使用者按取消就不下載

            const blob = new Blob([originalData]);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        }

        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 15 }, false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        };
    </script>
</body>
</html>
